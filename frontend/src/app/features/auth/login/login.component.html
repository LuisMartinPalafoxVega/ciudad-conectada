<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-city" aria-hidden="true"></i></div>
    </div>
    
    <h1>Ciudad Conectada</h1>
    <p class="subtitle">Tu comunidad, en mejores manos</p>
    
    <div class="form-container">
      <h2>Bienvenido de nuevo</h2>
      <p class="form-subtitle">Inicia sesión para seguir el progreso de tu comunidad</p>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            [class.invalid]="email?.invalid && email?.touched"
          />
          <div class="error-message" *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']">El email es requerido</span>
            <span *ngIf="email?.errors?.['email']">Email inválido</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            [class.invalid]="password?.invalid && password?.touched"
          />
          <div class="error-message" *ngIf="password?.invalid && password?.touched">
            <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
            <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>
        </div>
        
        <div class="error-message" *ngIf="error">{{ error }}</div>
        
        <button type="submit" class="btn-primary" [disabled]="loading || loginForm.invalid">
          {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>
        
        <a routerLink="/auth/forgot-password" class="link">¿Olvidaste tu contraseña?</a>
        
        <p class="register-link">
          ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
        </p>
      </form>
    </div>
  </div>
</div>
